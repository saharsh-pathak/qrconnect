<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <linearGradient id="curveGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- Flowing topographic contour lines -->
  <path d="M-100,200 Q200,350 450,220 T950,300" fill="none" stroke="url(#curveGrad)" stroke-width="1.2"/>
  <path d="M-100,230 Q200,380 450,250 T950,330" fill="none" stroke="url(#curveGrad)" stroke-width="1.2"/>
  <path d="M-100,260 Q200,410 450,280 T950,360" fill="none" stroke="url(#curveGrad)" stroke-width="1.2"/>
  <path d="M-100,290 Q200,440 450,310 T950,390" fill="none" stroke="url(#curveGrad)" stroke-width="1.2"/>
  <path d="M-100,320 Q200,470 450,340 T950,420" fill="none" stroke="url(#curveGrad)" stroke-width="1.2"/>

  <!-- Right side swirling curves -->
  <path d="M300,500 C650,450 850,750 1000,600" fill="none" stroke="url(#curveGrad)" stroke-width="1.2"/>
  <path d="M280,530 C630,480 830,780 1000,630" fill="none" stroke="url(#curveGrad)" stroke-width="1.2"/>
  <path d="M260,560 C610,510 810,810 1000,660" fill="none" stroke="url(#curveGrad)" stroke-width="1.2"/>

  <!-- Lower field curves -->
  <path d="M-50,900 Q300,1050 600,950 T1050,1100" fill="none" stroke="url(#curveGrad)" stroke-width="1.2"/>
  <path d="M-50,930 Q300,1080 600,980 T1050,1130" fill="none" stroke="url(#curveGrad)" stroke-width="1.2"/>
  <path d="M-50,960 Q300,1110 600,1010 T1050,1160" fill="none" stroke="url(#curveGrad)" stroke-width="1.2"/>
  <path d="M-50,990 Q300,1140 600,1040 T1050,1190" fill="none" stroke="url(#curveGrad)" stroke-width="1.2"/>
  <path d="M-50,1020 Q300,1170 600,1070 T1050,1220" fill="none" stroke="url(#curveGrad)" stroke-width="1.2"/>

  <!-- Bottom sweep -->
  <path d="M-50,1350 Q400,1200 950,1400" fill="none" stroke="url(#curveGrad)" stroke-width="1.2"/>
  <path d="M-50,1380 Q400,1230 950,1430" fill="none" stroke="url(#curveGrad)" stroke-width="1.2"/>
  <path d="M-50,1410 Q400,1260 950,1460" fill="none" stroke="url(#curveGrad)" stroke-width="1.2"/>
</svg>
