<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JIIT @ IMC 2026 | Edge Intelligence & Telemedicine</title>
  <meta name="description" content="Jaypee Institute of Information Technology students exhibiting SEHAT, MistMinds, and AgriCar at Indian Mobile Congress 2026.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <header class="brand-logos">
      <img src="assets/ui/jiit_logo.png" alt="JIIT Emblem" class="brand-logo-img">
      <img src="assets/ui/imc_logo.png" alt="IMC 2026 10 Years Logo" class="brand-logo-img">
    </header>

    <main style="display: flex; flex-direction: column; flex: 1;">
      <div style="margin-top: 1.5rem;">
        <h1 class="hero-title">Innovating<br/>for a Connected<br/>Tomorrow</h1>
        <p class="page-subtitle">Students. Projects. Real Impact.</p>
      </div>

      <!-- Action Cards with vertical divider matching UI mockup -->
      <div class="action-cards-stack">
        <!-- Explore Projects Card -->
        <a href="projects.html" class="action-split-card action-card-dark" id="btn-explore-projects">
          <div class="action-card-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
              <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
              <line x1="12" y1="22.08" x2="12" y2="12"/>
            </svg>
          </div>
          <div class="action-card-divider"></div>
          <div class="action-card-content">
            <div class="action-card-title">Explore Projects</div>
            <div class="action-card-sub">Three ideas. Real-world impact.</div>
          </div>
          <div class="action-card-arrow">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </div>
        </a>

        <!-- Connect With Us Card -->
        <a href="team.html" class="action-split-card action-card-light" id="btn-connect-team">
          <div class="action-card-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </div>
          <div class="action-card-divider"></div>
          <div class="action-card-content">
            <div class="action-card-title">Connect With Us</div>
            <div class="action-card-sub">Meet the team.</div>
          </div>
          <div class="action-card-arrow">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </div>
        </a>
      </div>
    </main>
  </div>
  <script src="js/agentation-loader.js"></script>
</body>
</html>
