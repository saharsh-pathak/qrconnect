<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Project Details | JIIT IMC 2026</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Pager Bar matching UI mockup -->
    <nav class="nav-bar-pager">
      <a href="projects.html" class="nav-back-link" aria-label="Back to projects">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        <span>Our Projects</span>
      </a>

      <div class="pager-ctrls">
        <span id="pager-counter">1 / 3</span>
        <a id="btn-prev-proj" href="#" class="pager-arrow-btn" aria-label="Previous project">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <a id="btn-next-proj" href="#" class="pager-arrow-btn" aria-label="Next project">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </a>
      </div>
    </nav>

    <main>
      <!-- Hero Section -->
      <div id="detail-accent" class="detail-accent-bar"></div>
      <h1 id="detail-title" class="detail-title-large">SEHAT</h1>
      <h2 id="detail-subtitle" class="detail-subtitle-text">Smart Edge Healthcare and Telemedicine Device</h2>
      <p id="detail-desc" class="detail-desc-text"></p>

      <!-- Hardware Device Hero Image -->
      <div class="detail-hero-visual">
        <img id="detail-hero-img" src="" alt="Hardware device render">
      </div>

      <!-- 4-Pill Feature Row (2x2 Grid) -->
      <section class="pills-grid" id="pills-container"></section>

      <!-- Video Demo Showcase Card -->
      <section class="demo-banner-card">
        <img id="detail-demo-img" src="" alt="Live demo preview">
      </section>

      <!-- Key Components Section -->
      <section>
        <h3 class="section-heading-sm">Key Components</h3>
        <div class="components-list" id="components-container"></div>
      </section>

      <!-- Technologies Used Section -->
      <section>
        <h3 class="section-heading-sm">Technologies Used</h3>
        <div class="tech-chips-wrap" id="tech-container"></div>
      </section>

      <!-- Dual Bottom Action Bar -->
      <div class="bottom-cta-bar">
        <a id="btn-dl-pdf" href="#" download class="btn-cta-dark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Download Project PDF
        </a>

        <a id="btn-view-doc" href="team.html" class="btn-cta-light">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
          View Documentation
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script>
    const order = ["sehat", "mistminds", "agricar"];
    const params = new URLSearchParams(window.location.search);
    let currentId = params.get('id') || 'sehat';
    if (!PROJECTS_DATA[currentId]) currentId = 'sehat';

    const proj = PROJECTS_DATA[currentId];
    const currentIndex = order.indexOf(currentId);

    // Update Page Meta & Pager
    document.title = `${proj.name} | JIIT IMC 2026`;
    document.getElementById('pager-counter').textContent = `${currentIndex + 1} / 3`;

    // Next / Previous Pager Links
    const prevIndex = (currentIndex - 1 + order.length) % order.length;
    const nextIndex = (currentIndex + 1) % order.length;
    document.getElementById('btn-prev-proj').href = `project-detail.html?id=${order[prevIndex]}`;
    document.getElementById('btn-next-proj').href = `project-detail.html?id=${order[nextIndex]}`;

    // Accent Line & Titles
    document.getElementById('detail-accent').style.background = proj.accentColor;
    document.getElementById('detail-title').textContent = proj.name;
    document.getElementById('detail-subtitle').textContent = proj.subtitle;
    document.getElementById('detail-desc').textContent = proj.description;

    // Images
    document.getElementById('detail-hero-img').src = proj.heroImg;
    document.getElementById('detail-demo-img').src = proj.demoImg;

    // Feature Pills (4 pills)
    const pillsContainer = document.getElementById('pills-container');
    pillsContainer.innerHTML = proj.pills.map(p => `
      <div class="feature-pill-card">
        <div class="feature-pill-icon">${p.icon}</div>
        <div class="feature-pill-title">${p.title}</div>
        <div class="feature-pill-desc">${p.desc}</div>
      </div>
    `).join('');

    // Key Components (3 cards)
    const compContainer = document.getElementById('components-container');
    compContainer.innerHTML = proj.components.map(c => `
      <div class="component-card">
        <div class="component-icon-box">${c.icon}</div>
        <div>
          <div class="component-title">${c.title}</div>
          <div class="component-desc">${c.desc}</div>
        </div>
      </div>
    `).join('');

    // Technologies Used (chips)
    const techContainer = document.getElementById('tech-container');
    techContainer.innerHTML = proj.techStack.map(t => `
      <span class="tech-chip">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="${proj.accentColor}" stroke-width="2.5"><circle cx="12" cy="12" r="10"/></svg>
        ${t}
      </span>
    `).join('');

    // Download PDF Button
    const dlBtn = document.getElementById('btn-dl-pdf');
    dlBtn.href = proj.pdfFile;
    dlBtn.setAttribute('download', `${proj.id}-project-info.pdf`);

    // View Documentation -> Team / Connect link
    document.getElementById('btn-view-doc').href = `team.html?project=${proj.id}`;
  </script>
  <script src="js/agentation-loader.js"></script>
</body>
</html>
